<style>
/* ============================================================================
   Devertix — AI megoldások
   Arculat a devertix.com-ról: Poppins + Open Sans, #511B9A lila, #07063E sötét,
   #20B9F5 cián, #DC8B10 borostyán. A c:\> motívum a céges prezentációból.

   EGYETLEN FÁJL, több oldallal. A navigáció a címsor #/... részével működik,
   ezért fájlból megnyitva is jó, és offline is.

   BŐVÍTÉS: a lap alján a PAGES objektum (aloldalak) és a USE_CASES tömb
   (megoldástár). Egy új bejegyzés hozzáadása elég, minden más magától frissül.
   ========================================================================== */

:root {
  --brand:#511B9A; --brand-deep:#321881; --brand-soft:#EDE6F8;
  --cyan:#1183B4;  --cyan-soft:#E0F2FB;
  --amber:#A8670A; --amber-soft:#FBF0DC;
  /* --ink-faint sötétebb, mint amilyen "halvány" színt elsőre választanánk:
     fehér alapon a világosabb árnyalat 3,4:1-en marad, ami olvashatatlanul kevés */
  --ink:#12102B; --ink-muted:#605C7C; --ink-faint:#6E6A8A;
  --bg:#FFFFFF; --surface:#F7F5FB; --surface-2:#FFFFFF; --line:#E4E0EF;
  --night:#07063E; --on-night:#FFFFFF; --on-night-dim:#B3AECF;
  --radius:14px; --maxw:1160px;
  --shadow:0 1px 2px rgba(18,16,43,.06), 0 8px 24px rgba(18,16,43,.06);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --brand:#A98AE8; --brand-deep:#C4ADF2; --brand-soft:#251A3D;
    --cyan:#58C8F5;  --cyan-soft:#102A3A;
    --amber:#E0A33F; --amber-soft:#35270F;
    --ink:#F2F0FA; --ink-muted:#A9A4C4; --ink-faint:#7C7799;
    --bg:#0B0A1B; --surface:#12102B; --surface-2:#171436; --line:#2A2650;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"] {
  --brand:#A98AE8; --brand-deep:#C4ADF2; --brand-soft:#251A3D;
  --cyan:#58C8F5;  --cyan-soft:#102A3A;
  --amber:#E0A33F; --amber-soft:#35270F;
  --ink:#F2F0FA; --ink-muted:#A9A4C4; --ink-faint:#7C7799;
  --bg:#0B0A1B; --surface:#12102B; --surface-2:#171436; --line:#2A2650;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
}

* { box-sizing:border-box; }
body {
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Open Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:16px; line-height:1.65; -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4 {
  font-family:Poppins,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-weight:500; line-height:1.2; text-wrap:balance; margin:0;
}
p { margin:0; }
a { color:inherit; }
.wrap { max-width:var(--maxw); margin:0 auto; padding:0 24px; }

.prompt {
  font-family:"JetBrains Mono",ui-monospace,"Courier New",monospace;
  font-size:.8rem; font-weight:600; letter-spacing:.04em;
  color:var(--brand); display:block; margin-bottom:14px;
}
.prompt::before { content:"c:\\> "; opacity:.55; }
.prompt::after { content:"_"; animation:blink 1.3s step-end infinite; }
@keyframes blink { 50% { opacity:0; } }

/* -------------------------------------------------------------- fejléc --- */
.topbar {
  position:sticky; top:0; z-index:20;
  background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:saturate(1.4) blur(10px);
  border-bottom:1px solid var(--line);
}
.topbar .wrap { display:flex; align-items:center; gap:22px; height:60px; }
.brand {
  font-family:Poppins,sans-serif; font-weight:600; font-size:1.02rem;
  text-decoration:none; letter-spacing:-.01em; white-space:nowrap;
}
.brand span { color:var(--brand); }
.topnav { display:flex; gap:20px; flex-wrap:wrap; align-items:center; margin-left:auto; }
.topnav > a, .dd > button {
  text-decoration:none; font-size:.9rem; color:var(--ink-muted);
  padding:4px 0; border-bottom:2px solid transparent;
  background:none; border-top:0; border-left:0; border-right:0;
  font-family:inherit; cursor:pointer;
}
.topnav > a:hover, .topnav > a.on, .dd > button:hover, .dd > button.on {
  color:var(--brand); border-bottom-color:var(--brand);
}
.topnav > a:focus-visible, .dd > button:focus-visible { outline:2px solid var(--cyan); outline-offset:3px; }

/* lenyíló menü a termékekhez */
.dd { position:relative; }
.dd > button::after { content:" ▾"; font-size:.8em; }
.dd-panel {
  position:absolute; right:0; top:calc(100% + 12px); z-index:30;
  min-width:250px; padding:8px;
  background:var(--surface-2); border:1px solid var(--line); border-radius:12px;
  box-shadow:var(--shadow); display:none; flex-direction:column;
}
.dd-panel.open { display:flex; }
.dd-panel a {
  text-decoration:none; font-size:.9rem; color:var(--ink);
  padding:9px 12px; border-radius:8px;
}
.dd-panel a:hover, .dd-panel a.on { background:var(--brand-soft); color:var(--brand); }
.dd-panel a:focus-visible { outline:2px solid var(--cyan); outline-offset:-2px; }

/* ----------------------------------------------------------------- hős --- */
.hero {
  background:var(--night);
  background-image:
    radial-gradient(900px 460px at 86% -18%, rgba(81,27,154,.55), transparent 64%),
    radial-gradient(620px 340px at 6% 112%, rgba(32,185,245,.16), transparent 62%);
  color:var(--on-night); padding:72px 0 64px;
}
.hero .prompt { color:#9C8DFF; }
.hero h1 { font-size:clamp(1.95rem,4.4vw,3rem); max-width:21ch; margin-bottom:18px; }
.hero p { color:var(--on-night-dim); max-width:62ch; font-size:1.05rem; }
.hero-meta {
  display:flex; flex-wrap:wrap; gap:10px 26px; margin-top:28px;
  font-family:"JetBrains Mono",ui-monospace,monospace;
  font-size:.76rem; letter-spacing:.03em; color:var(--on-night-dim);
}
.hero-meta span { display:inline-flex; align-items:center; gap:8px; }
.hero-meta span::before { content:""; width:6px; height:6px; border-radius:50%; background:#9C8DFF; flex:none; }

/* ------------------------------------------------------------ szekciók --- */
section { padding:64px 0; }
.tint { background:var(--surface); border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
.sec-head { max-width:64ch; margin-bottom:32px; }
.sec-head h2 { font-size:clamp(1.45rem,2.6vw,2rem); margin-bottom:12px; }
.sec-head p { color:var(--ink-muted); }

/* --------------------------------------------------------------- kártya --- */
.cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:20px; }
.cards.four { grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); }
.tile {
  background:var(--surface-2); border:1px solid var(--line); border-radius:var(--radius);
  padding:26px 24px 22px; box-shadow:var(--shadow);
  display:flex; flex-direction:column; gap:11px;
  text-decoration:none; color:inherit;
  transition:border-color .15s, transform .15s;
}
a.tile:hover { border-color:var(--brand); transform:translateY(-2px); }
a.tile:focus-visible { outline:2px solid var(--cyan); outline-offset:3px; }
.tag {
  font-family:"JetBrains Mono",ui-monospace,monospace;
  font-size:.68rem; font-weight:600; letter-spacing:.07em; text-transform:uppercase;
  padding:5px 10px; border-radius:999px; align-self:flex-start;
  background:var(--brand-soft); color:var(--brand);
}
.tag.amber { background:var(--amber-soft); color:var(--amber); }
.tag.cyan  { background:var(--cyan-soft);  color:var(--cyan); }
.tile h3 { font-size:1.16rem; }
.tile p { color:var(--ink-muted); font-size:.94rem; }
.tile ul { margin:2px 0 0; padding-left:18px; color:var(--ink-muted); font-size:.91rem; }
.tile li { margin-bottom:4px; }
.more {
  margin-top:auto; padding-top:12px;
  font-family:Poppins,sans-serif; font-weight:500; font-size:.9rem; color:var(--brand);
}
.more::after { content:" →"; }

/* ------------------------------------------------------------ katalógus --- */
.controls { display:flex; flex-wrap:wrap; gap:12px; align-items:center; margin-bottom:22px; }
.chips { display:flex; flex-wrap:wrap; gap:8px; }
.chip {
  font-family:"JetBrains Mono",ui-monospace,monospace; font-size:.78rem; font-weight:600;
  padding:8px 14px; border-radius:999px;
  border:1px solid var(--line); background:var(--surface-2); color:var(--ink-muted);
  cursor:pointer; transition:background .15s,color .15s,border-color .15s;
}
.chip:hover { border-color:var(--brand); color:var(--brand); }
.chip[aria-pressed="true"] { background:var(--brand); border-color:var(--brand); color:#fff; }
:root[data-theme="dark"] .chip[aria-pressed="true"] { color:#14102B; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .chip[aria-pressed="true"] { color:#14102B; }
}
.chip:focus-visible, .search:focus-visible { outline:2px solid var(--cyan); outline-offset:2px; }
.search {
  flex:1 1 220px; min-width:200px; padding:9px 14px; border-radius:999px;
  border:1px solid var(--line); background:var(--surface-2); color:var(--ink);
  font-family:inherit; font-size:.9rem;
}
.search::placeholder { color:var(--ink-faint); }
.count {
  font-family:"JetBrains Mono",ui-monospace,monospace;
  font-size:.78rem; color:var(--ink-faint); margin-bottom:16px;
}
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:18px; }
.uc {
  background:var(--surface-2); border:1px solid var(--line); border-radius:var(--radius);
  padding:22px; display:flex; flex-direction:column; gap:9px;
}
.uc .area {
  font-family:"JetBrains Mono",ui-monospace,monospace;
  font-size:.67rem; font-weight:600; letter-spacing:.06em; text-transform:uppercase;
  padding:4px 9px; border-radius:6px; align-self:flex-start;
  background:var(--brand-soft); color:var(--brand);
}
.uc h3 { font-size:1.04rem; }
.uc p { color:var(--ink-muted); font-size:.92rem; }
.gain {
  margin-top:auto; padding-top:11px; border-top:1px dashed var(--line);
  font-size:.88rem; color:var(--ink);
}
.gain b { font-weight:600; color:var(--brand); }
.empty { color:var(--ink-muted); padding:36px 0; }

/* -------------------------------------------------------------- lépések --- */
.steps { display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:20px; counter-reset:s; }
.step { padding-top:15px; border-top:2px solid var(--brand); }
.step::before {
  counter-increment:s; content:counter(s,decimal-leading-zero);
  font-family:"JetBrains Mono",ui-monospace,monospace;
  font-size:.73rem; font-weight:600; color:var(--brand); display:block; margin-bottom:7px;
}
.step h3 { font-size:1.03rem; margin-bottom:7px; }
.step p { color:var(--ink-muted); font-size:.92rem; }
.step .when {
  display:block; margin-top:8px;
  font-family:"JetBrains Mono",ui-monospace,monospace;
  font-size:.72rem; color:var(--ink-faint);
}

/* ---------------------------------------------------------------- kiemelt --- */
.stat {
  background:var(--surface-2); border:1px solid var(--line); border-left:4px solid var(--brand);
  border-radius:var(--radius); padding:22px 24px; margin-top:28px; max-width:70ch;
}
.stat b { font-family:Poppins,sans-serif; font-weight:600; font-size:1.3rem; color:var(--brand); display:block; }
.stat span { color:var(--ink-muted); font-size:.94rem; }

/* --------------------------------------------------------- árazási sávok --- */
/* Három opció egy tengelyen: mennyire tudja már az ügyfél, hogy mit akar.
   A középső (fix áras) a hangsúlyos — de a két szélső is valódi választás. */
.tiers { display:grid; grid-template-columns:repeat(auto-fit,minmax(290px,1fr)); gap:20px; align-items:start; }
.tier {
  position:relative; display:flex; flex-direction:column; gap:12px;
  background:var(--surface-2); border:1px solid var(--line); border-radius:var(--radius);
  padding:28px 26px 26px;
}
.tier.featured {
  background:var(--brand-soft);
  border-color:var(--brand); border-top:4px solid var(--brand);
  box-shadow:var(--shadow); padding-top:34px;
}
/* a kiemelt kártyán a szaggatott elválasztó a színes alapon is látsszon */
.tier.featured .note { border-top-color:color-mix(in srgb, var(--brand) 30%, transparent); }
/* a halvány felirat a színes háttéren 3,8:1-re esne — erősebb színt kap */
.tier.featured .tier-who { color:var(--ink-muted); }
.tier-badge {
  position:absolute; top:-11px; left:26px;
  font-family:"JetBrains Mono",ui-monospace,monospace;
  font-size:.66rem; font-weight:600; letter-spacing:.06em; text-transform:uppercase;
  background:var(--brand); color:#fff; padding:4px 11px; border-radius:999px;
}
:root[data-theme="dark"] .tier-badge { color:#14102B; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tier-badge { color:#14102B; } }
.tier-who {
  font-family:"JetBrains Mono",ui-monospace,monospace;
  font-size:.7rem; font-weight:600; letter-spacing:.05em; text-transform:uppercase;
  color:var(--ink-faint);
}
.tier h3 { font-size:1.2rem; }
.tier-price {
  font-family:Poppins,sans-serif; font-weight:600; font-size:1.22rem; color:var(--brand);
  line-height:1.3;
}
.tier-price small { display:block; font-weight:400; font-size:.66em; color:var(--ink-muted); }
.tier > p { color:var(--ink-muted); font-size:.94rem; }
.tier ul { margin:4px 0 0; padding:0; list-style:none; display:flex; flex-direction:column; gap:9px; }
.tier li { display:flex; gap:10px; font-size:.92rem; }
.tier li::before { content:"—"; color:var(--brand); flex:none; }
.tier .note {
  margin-top:auto; padding-top:14px; border-top:1px dashed var(--line);
  font-size:.86rem; color:var(--ink-muted);
}
.tier-help {
  margin-top:22px; font-size:.94rem; color:var(--ink-muted); max-width:74ch;
}
.tier-help b { color:var(--ink); font-weight:600; }

/* -------------------------------------------------------------- kapcsolat --- */
.person {
  display:flex; flex-wrap:wrap; gap:6px 28px; align-items:baseline;
  margin-top:24px; padding:20px 24px;
  border:1px solid rgba(255,255,255,.18); border-radius:var(--radius);
}
.person .who { font-family:Poppins,sans-serif; font-weight:500; font-size:1.1rem; color:var(--on-night); }
.person .role { color:var(--on-night-dim); font-size:.9rem; }
.person a {
  font-family:"JetBrains Mono",ui-monospace,monospace; font-size:.92rem;
  color:#C9BCFF; text-decoration:none; border-bottom:1px solid rgba(201,188,255,.4);
}
.person a:hover { color:#fff; border-bottom-color:#fff; }
.person a:focus-visible { outline:2px solid #9C8DFF; outline-offset:3px; }

/* ------------------------------------------------------------------ gyik --- */
.faq { display:flex; flex-direction:column; gap:10px; max-width:80ch; }
details {
  background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:0 18px;
}
summary {
  cursor:pointer; padding:15px 0; font-family:Poppins,sans-serif; font-weight:500;
  list-style:none; display:flex; align-items:center; gap:12px;
}
summary::-webkit-details-marker { display:none; }
summary::after {
  content:"+"; margin-left:auto; color:var(--brand);
  font-family:"JetBrains Mono",monospace; font-size:1.1rem; flex:none;
}
details[open] summary::after { content:"–"; }
summary:focus-visible { outline:2px solid var(--cyan); outline-offset:2px; border-radius:4px; }
details p { padding:0 0 18px; color:var(--ink-muted); font-size:.95rem; max-width:66ch; }

/* ------------------------------------------------------------------ záró --- */
.cta { background:var(--night); color:var(--on-night); }
.cta .prompt { color:#9C8DFF; }
.cta h2 { font-size:clamp(1.45rem,2.6vw,2rem); margin-bottom:14px; }
.cta p { color:var(--on-night-dim); max-width:62ch; }
.cta-links { display:flex; flex-wrap:wrap; gap:12px; margin-top:24px; }
.btn {
  display:inline-block; padding:12px 22px; border-radius:999px;
  font-family:Poppins,sans-serif; font-weight:500; font-size:.94rem; text-decoration:none;
  background:#6C3FD1; color:#fff; border:1px solid transparent; transition:background .15s;
}
.btn:hover { background:#7d52dd; }
.btn.ghost { background:transparent; border-color:rgba(255,255,255,.28); color:var(--on-night); }
.btn.ghost:hover { background:rgba(255,255,255,.08); }
.btn:focus-visible { outline:2px solid #9C8DFF; outline-offset:3px; }

.back {
  display:inline-block; margin-bottom:18px; text-decoration:none;
  font-family:"JetBrains Mono",ui-monospace,monospace; font-size:.78rem; color:var(--on-night-dim);
}
.back:hover { color:#fff; }
.back::before { content:"← "; }

footer { padding:28px 0 44px; color:var(--ink-faint); font-size:.85rem; }
footer p + p { margin-top:6px; }

@media (prefers-reduced-motion: reduce) { * { animation:none !important; transition:none !important; } }
@media (max-width: 640px) {
  .topbar .wrap { height:auto; padding-top:10px; padding-bottom:10px; flex-wrap:wrap; gap:10px; }
  .topnav { margin-left:0; gap:14px; }
}
</style>

<script>
/* ===========================================================================
   ALOLDALAK
   ---------------------------------------------------------------------------
   Új aloldal: vegyél fel egy új kulcsot a PAGES-be, és ha a fejlécben is
   látszódjon, írd be a NAV tömbbe. Minden mező elhagyható a címen kívül.

     kind   : "megoldas" (a három belépő) vagy "alkalmazas" (a négy alkalmazás)
     lead   : a cím alatti bevezető
     stat   : kiemelt eredmény {value, label} — csak valós adatot tegyünk ide!
     does   : "Mit csinál a rendszer" blokkok
     steps  : bevezetési szakaszok {h, p, when}
     why    : "Miért mi" pontok
     faq    : gyakori kérdések {q, a}
   ========================================================================= */
const PAGES = {

  /* ------------------------------------------------------------- KKV --- */
  "kkv": {
    kind: "megoldas", tagClass: "",
    nav: "KKV",
    tag: "AI bevezetés — KKV",
    title: "AI bevezetés kis- és középvállalkozásoknak",
    lead: "Egy 10–100 fős cégnél az AI ott térül meg, ahol a legtöbb manuális, ismétlődő és monoton feladat van. Ezek időigényesek, magas rajtuk a hibázási esély, és a monotonitás miatt a fluktuáció is nagyobb.",
    intro: "Ezért nem azzal kezdünk, hogy mit lehetne megépíteni, hanem azzal, hogy hol megy el nálatok a legtöbb idő. Az első lépés egy fix áras csomag, aminek a végén nemcsak egy működő automatizáció lesz a kezetekben, hanem egy számokkal alátámasztott terv is a folytatásra.",
    does: [
      { h: "Időigényes", p: "Az ismétlődő feladatok napi szinten visznek el órákat úgy, hogy közben nem keletkezik belőlük többletérték. Ez az az idő, ami visszanyerhető." },
      { h: "Magas a hibázási esély", p: "Ahol sokszor kell ugyanazt kézzel átvinni egyik helyről a másikra, ott elkerülhetetlen a hiba. A javítás pedig többe kerül, mint az eredeti munka." },
      { h: "Nagyobb a fluktuáció", p: "A monoton munkát senki nem szereti hosszú távon csinálni. Ha ezt leveszitek a kollégákról, azzal nemcsak időt nyertek, hanem embereket is megtartotok." },
      { h: "A rendszer a tiétek marad", p: "Minden megoldást a ti saját környezetetekben építünk fel. Az adat nem kerül ki, és nem tanítunk vele modellt." }
    ],
    doesTitle: "Miért pont ezeken a folyamatokon éri meg kezdeni",
    tiersTitle: "Háromféleképpen lehet elkezdeni",
    tiersLead: "A különbség nem a minőségben van, hanem abban, hogy mennyire tudjátok már, mit akartok. Válasszátok azt, ami a mostani helyzetetekre igaz.",
    tiersHelp: "<b>Nem tudod, melyik?</b> Ha a folyamat már ki van választva és egyszerű, a célzott automatizáció a gyorsabb út. Ha még kérdés, hol érdemes kezdeni, akkor a Starter csomag — a felmérés pont erre ad választ, és a végén ugyanúgy működő automatizáció lesz a kezetekben.",

    const p = PAGES[k];
    return `<a class="tile" href="#/${k}">
      <span class="tag ${p.tagClass || ""}">${esc(p.tag)}</span>
      <h3>${esc(p.title)}</h3>
      <p>${esc(p.lead.split(". ")[0])}.</p>
      <span class="more">Részletek</span>
    </a>`;
  }).join("");
}

      <span class="tier-price">${esc(t.price)}<small>${esc(t.priceNote)}</small></span>

    `<article class="step"><h3>${esc(s.h)}</h3><p>${esc(s.p)}</p>${s.when ? `<span class="when">${esc(s.when)}</span>` : ""}</article>`).join("")}</div>` : "";

    `<article class="tile"><h3>${esc(w.h)}</h3><p>${esc(w.p)}</p></article>`).join("")}</div>` : "";

function buildNav(current) {
  const bar = document.getElementById("topnav");
  bar.innerHTML = NAV.map(item => {
    if (item.key) {
      return `<a href="#/${item.key}" class="${item.key === current ? "on" : ""}">${esc(PAGES[item.key].nav)}</a>`;
    }
    const inside = item.children.includes(current);
    return `<span class="dd">
      <button type="button" class="${inside ? "on" : ""}" aria-expanded="false">${esc(item.label)}</button>
      <span class="dd-panel">${item.children.map(k =>
        `<a href="#/${k}" class="${k === current ? "on" : ""}">${esc(PAGES[k].nav)}</a>`).join("")}</span>
    </span>`;
  }).join("");

  bar.querySelectorAll(".dd").forEach(dd => {
    const btn = dd.querySelector("button"), panel = dd.querySelector(".dd-panel");
    btn.addEventListener("click", e => {
      e.stopPropagation();
      const open = panel.classList.toggle("open");
      btn.setAttribute("aria-expanded", String(open));
    });
    panel.addEventListener("click", e => e.stopPropagation());
  });
}

/* a lenyíló menü bezárása kattintásra és Escape-re */
function closeMenus() {
  document.querySelectorAll(".dd-panel.open").forEach(p => {
    p.classList.remove("open");
    p.parentElement.querySelector("button").setAttribute("aria-expanded", "false");
  });
}
document.addEventListener("click", closeMenus);
document.addEventListener("keydown", e => { if (e.key === "Escape") closeMenus(); });

/* -------------------------------------------------------------- katalógus --- */
let activeArea = "mind";
function initCatalog() {
  const chipBox = document.getElementById("chips");
  const search = document.getElementById("search");
  const grid = document.getElementById("grid");
  const countEl = document.getElementById("count");
  if (!chipBox) return;
  const areas = ["mind", ...new Set(USE_CASES.map(u => u.area))];
  activeArea = "mind";

  function render() {
    const q = search.value.trim().toLowerCase();
    const list = USE_CASES.filter(u => {
      const okArea = activeArea === "mind" || u.area === activeArea;
      const hay = (u.title + " " + u.text + " " + u.gain + " " + u.area).toLowerCase();
      return okArea && (!q || hay.includes(q));
    });
    countEl.textContent = list.length ? `${list.length} felhasználási eset` : "";
    grid.innerHTML = list.length ? list.map(u => `
      <article class="uc">
        <span class="area">${esc(u.area)}</span>
        <h3>${esc(u.title)}</h3>
        <p>${esc(u.text)}</p>
        <p class="gain">${u.gain}</p>
      </article>`).join("")
      : `<p class="empty">Erre nincs találat. Próbáljatok más kifejezést, vagy kérdezzetek rá közvetlenül — a lista folyamatosan bővül.</p>`;
  }

  chipBox.innerHTML = areas.map(a =>
    `<button class="chip" type="button" data-area="${esc(a)}" aria-pressed="${a === activeArea}">${esc(a)}</button>`).join("");
  chipBox.querySelectorAll(".chip").forEach(btn => btn.addEventListener("click", () => {
    activeArea = btn.dataset.area;
    chipBox.querySelectorAll(".chip").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.area === activeArea)));
    render();
  }));
  search.addEventListener("input", render);
  render();
}

/* ------------------------------------------------------------- útvonalak --- */
function route() {
  const key = (location.hash.replace(/^#\/?/, "") || "").trim();
  if (key && PAGES[key]) {
    app.innerHTML = pageView(key);
    buildNav(key);
  } else {
    app.innerHTML = homeView();
    buildNav(null);
    initCatalog();
  }
  window.scrollTo({ top: 0, behavior: "instant" });
}
window.addEventListener("hashchange", route);
route();
</script>
